<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Awesome Virtual Power Plant banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a33"/>
      <stop offset="0.55" stop-color="#0e3a66"/>
      <stop offset="1" stop-color="#07283f"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4dd0e1"/>
      <stop offset="0.5" stop-color="#7c9bff"/>
      <stop offset="1" stop-color="#ffca5f"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4dd0e1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fe0f0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4dd0e1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4dd0e1" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#4dd0e1" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .sub   { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      @keyframes sweep {
        0%   { transform: translateX(-500px); opacity: 0; }
        8%   { opacity: 0.55; }
        92%  { opacity: 0.55; }
        100% { transform: translateX(1700px); opacity: 0; }
      }
      .sweep { animation: sweep 6s ease-in-out infinite; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.12; }
      }
      .blink { animation: blink 1.1s ease-in-out infinite; }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.75; }
      }
      .glow-pulse { animation: glowPulse 2.4s ease-in-out infinite; }
      @keyframes drift {
        0%   { transform: translateY(0); opacity: 0; }
        15%  { opacity: 0.85; }
        85%  { opacity: 0.85; }
        100% { transform: translateY(-46px); opacity: 0; }
      }
      .drift { animation: drift 5s ease-in-out infinite; }
      @keyframes textShimmer {
        0%   { opacity: 1; }
        50%  { opacity: 0.82; }
        100% { opacity: 1; }
      }
      .shimmer { animation: textShimmer 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Circuit traces -->
  <g fill="none" stroke="#2f6fa8" stroke-width="2" opacity="0.45">
    <path id="trace1" d="M40 260 L560 260 L720 212 L1180 212"/>
    <path id="trace2" d="M40 40 L320 40 L480 120 L840 120"/>
    <path id="trace3" d="M860 260 L1010 260 L1140 210"/>
    <path id="trace4" d="M40 150 L180 150 L260 90 L620 90"/>
  </g>

  <!-- Nodes on the circuit -->
  <g fill="#4dd0e1">
    <circle cx="40" cy="260" r="3.5"/>
    <circle cx="560" cy="260" r="3.5"/>
    <circle cx="720" cy="212" r="3.5"/>
    <circle cx="1180" cy="212" r="3.5"/>
    <circle cx="40" cy="40" r="3.5"/>
    <circle cx="320" cy="40" r="3.5"/>
    <circle cx="480" cy="120" r="3.5"/>
    <circle cx="840" cy="120" r="3.5"/>
    <circle cx="860" cy="260" r="3.5"/>
    <circle cx="1010" cy="260" r="3.5"/>
    <circle cx="1140" cy="210" r="3.5"/>
    <circle cx="40" cy="150" r="3.5"/>
    <circle cx="180" cy="150" r="3.5"/>
    <circle cx="260" cy="90" r="3.5"/>
    <circle cx="620" cy="90" r="3.5"/>
  </g>

  <!-- Energy pulses travelling along the traces -->
  <g>
    <circle r="5" fill="#7ddcf0" opacity="0.9">
      <animateMotion dur="6s" repeatCount="indefinite">
        <mpath href="#trace1"/>
      </animateMotion>
    </circle>
    <circle r="5" fill="#8fe0f0" opacity="0.85">
      <animateMotion dur="4.5s" repeatCount="indefinite">
        <mpath href="#trace2"/>
      </animateMotion>
    </circle>
    <circle r="5" fill="#7ddcf0" opacity="0.9">
      <animateMotion dur="3.6s" repeatCount="indefinite">
        <mpath href="#trace3"/>
      </animateMotion>
    </circle>
    <circle r="5" fill="#8fe0f0" opacity="0.85">
      <animateMotion dur="5.2s" repeatCount="indefinite">
        <mpath href="#trace4"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Title block -->
  <text class="title" x="70" y="116" font-size="48" fill="url(#titleGrad)" filter="url(#softGlow)">Awesome Virtual Power Plant</text>
  <text class="sub" x="72" y="160" font-size="24" fill="#cfe6f7">SaaS Platforms &amp; Open-Source Projects</text>
  <text class="sub" x="72" y="194" font-size="16.5" fill="#7fd8e8" letter-spacing="1.5">DER AGGREGATION · FLEXIBILITY MARKETS · DEMAND RESPONSE · GRID SERVICES</text>
  <text class="sub shimmer" x="72" y="266" font-size="14" fill="#7fb2d8">Last updated: August 2026 — community-curated</text>

  <!-- Light sweep -->
  <g class="sweep">
    <rect x="-300" y="-180" width="240" height="680" fill="url(#sweepGrad)" transform="rotate(18 0 0)"/>
  </g>

  <!-- ================= Icon cluster (right) ================= -->

  <!-- Sun -->
  <g>
    <circle cx="895" cy="92" r="42" fill="url(#nodeGlow)" class="glow-pulse"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 895 92" to="360 895 92" dur="32s" repeatCount="indefinite"/>
      <g stroke="#ffd54f" stroke-width="4" stroke-linecap="round">
        <line x1="895" y1="52" x2="895" y2="62"/>
        <line x1="895" y1="122" x2="895" y2="132"/>
        <line x1="855" y1="92" x2="865" y2="92"/>
        <line x1="925" y1="92" x2="935" y2="92"/>
        <line x1="867" y1="64" x2="874" y2="71"/>
        <line x1="916" y1="113" x2="923" y2="120"/>
        <line x1="867" y1="120" x2="874" y2="113"/>
        <line x1="916" y1="71" x2="923" y2="64"/>
      </g>
      <circle cx="895" cy="92" r="20" fill="#ffd54f"/>
      <circle cx="895" cy="92" r="10" fill="#ffe082"/>
    </g>
  </g>

  <!-- Wind turbine -->
  <g>
    <rect x="1014" y="112" width="8" height="96" fill="#b8d4f0"/>
    <rect x="1006" y="206" width="24" height="8" rx="3" fill="#7fb2d8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 1018 108" to="360 1018 108" dur="7s" repeatCount="indefinite"/>
      <g fill="#e8f4fb">
        <path d="M1018 108 L1002 62 L1008 62 Z"/>
        <path d="M1018 108 L1034 62 L1028 62 Z"/>
        <path d="M1018 108 L1050 118 L1046 124 Z"/>
        <path d="M1018 108 L986 118 L990 124 Z"/>
        <path d="M1018 108 L1020 154 L1016 154 Z"/>
      </g>
      <circle cx="1018" cy="108" r="7" fill="#4dd0e1"/>
    </g>
    <circle cx="1018" cy="108" r="26" fill="url(#nodeGlow)" class="glow-pulse"/>
  </g>

  <!-- Battery charging -->
  <g>
    <rect x="1124" y="42" width="18" height="16" rx="3" fill="#4dd0e1"/>
    <rect x="1108" y="58" width="50" height="112" rx="9" fill="none" stroke="#4dd0e1" stroke-width="4"/>
    <rect x="1120" y="70" width="26" height="88" rx="5" fill="#4dd0e1" opacity="0.5">
      <animate attributeName="y" values="146;70;146" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="height" values="12;88;12" dur="4s" repeatCount="indefinite"/>
    </rect>
    <polygon class="blink" points="1138,72 1122,104 1132,104 1126,140 1146,104 1136,104 1144,72" fill="#ffd54f"/>
  </g>

  <!-- Drifting energy particles -->
  <g fill="#7ddcf0">
    <circle class="drift" cx="880" cy="205" r="3" style="animation-delay: 0s"/>
    <circle class="drift" cx="930" cy="225" r="2.5" style="animation-delay: 1.2s"/>
    <circle class="drift" cx="1010" cy="215" r="3" style="animation-delay: 2.1s"/>
    <circle class="drift" cx="1060" cy="235" r="2.5" style="animation-delay: 0.6s"/>
    <circle class="drift" cx="1145" cy="218" r="3" style="animation-delay: 1.7s"/>
    <circle class="drift" cx="965" cy="205" r="2" style="animation-delay: 2.8s"/>
    <circle class="drift" cx="1095" cy="200" r="2" style="animation-delay: 3.4s"/>
  </g>

  <!-- Accent strip -->
  <rect x="0" y="286" width="1200" height="14" fill="url(#titleGrad)" opacity="0.9"/>
</svg>
